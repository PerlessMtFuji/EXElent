name: Packaged product
on:
  workflow_call:

jobs:
  product:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --dev
      - run: uv pip install pyinstaller==6.16.0
      - name: Build EXElent.exe
        run: uv run python build_exelent.py
      - name: Frozen validator, cold bootstrap and repeat build
        env:
          EXELENT_TEST_EXE: ${{ github.workspace }}\dist\EXElent.exe
        run: uv run pytest tests/test_product_smoke.py -v -m slow --basetemp=build/product-smoke --junitxml=build/product-smoke.xml
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: product-diagnostics
          retention-days: 7
          path: |
            build/product-smoke.xml
            build/product-smoke/**/context.json
            build/product-smoke/**/cold.json
            build/product-smoke/**/cold.log
            build/product-smoke/**/invalid.json
            build/product-smoke/**/warm.json
            build/product-smoke/**/warm.log
