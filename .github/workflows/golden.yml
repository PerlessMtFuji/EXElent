name: Golden builds
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  golden:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: pytest tests/test_golden_builds.py -v -m slow
