name: Golden builds
on:
  workflow_call:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "exelent/**"
      - "tests/**"
      - "build_exelent.py"
      - "pyproject.toml"
      - ".github/workflows/**"

jobs:
  golden:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      # pytest creates only the last component of --basetemp, and build/ is
      # gitignored, so a fresh checkout does not have it.
      - run: New-Item -ItemType Directory -Force build | Out-Null
      - run: uv run pytest tests/test_golden_builds.py tests/test_local_resolver.py -v -m slow --basetemp=build/golden --junitxml=build/golden.xml
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diagnostics
          retention-days: 7
          path: |
            build/golden.xml
            build/golden/**/EXElent/logs/*.log

  self-build-as-tool:
    uses: ./.github/workflows/product.yml
