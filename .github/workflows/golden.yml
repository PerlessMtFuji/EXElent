name: Golden builds
on:
  workflow_call:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "exelent/**"
      - "tests/**"
      - "build_exelent.py"
      - "pyproject.toml"
      - ".github/workflows/**"

jobs:
  golden:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: pytest tests/test_golden_builds.py tests/test_local_resolver.py -v -m slow --basetemp=build/golden --junitxml=build/golden.xml

  self-build-as-tool:
    uses: ./.github/workflows/product.yml
